name: Validate Content & Build

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content & types
        run: pnpm validate

      - name: Verify generated JSON Schemas are up to date
        run: |
          pnpm schemas
          git diff --exit-code docs/ai/schemas

      - name: Build static site & search index
        run: pnpm build

