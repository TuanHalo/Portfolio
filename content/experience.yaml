- id: fullstack-engineer-nab
  company: NAB Innovation Centre Vietnam
  role:
    en: Fullstack Engineer
    vi: Kỹ sư Fullstack
  start: 2025-04-01
  location:
    en: Ho Chi Minh City, Vietnam
    vi: TP. Hồ Chí Minh, Việt Nam
  highlights:
    en:
      - Built and standardized 30+ reusable components for an internal dynamic form engine powering 100+ forms across banking shells (nabONE, nabTrade, nabConnect) with 100,000+ monthly banker and customer visits, decomposing complex components by purpose to reduce duplication and speed up form delivery.
      - Optimized form submission workflows using frontend debouncing and backend request batching to satisfy downstream API limits and lower server call volume, while auditing shared component dependencies before uplifts to prevent regressions.
      - Standardized backend structured logging across multi-API form orchestration flows, enabling OpenSearch dashboards and alerts (with Grafana performance checks) to track form metrics and quickly identify forms impacted by API outages.
      - Shipped 10+ bug fixes and accessibility improvements to NAB's MUI-based Elevate UI library, earning team recognition three times.
    vi:
      - Xây dựng và chuẩn hóa hơn 30 component tái sử dụng cho hệ thống tạo form động nội bộ vận hành hơn 100 form trên các nền tảng ngân hàng (nabONE, nabTrade, nabConnect) với hơn 100.000 lượt truy cập mỗi tháng, tách nhỏ component phức tạp theo mục đích để giảm trùng lặp và tăng tốc triển khai.
      - Tối ưu hóa luồng gửi form bằng debouncing ở frontend và batching request ở backend nhằm đáp ứng giới hạn API và giảm tải gọi server, đồng thời rà soát ảnh hưởng của các component dùng chung trước mỗi lần nâng cấp để tránh lỗi hồi quy.
      - Chuẩn hóa định dạng log backend cho các luồng form gọi nhiều API, hỗ trợ xây dựng dashboard và cảnh báo trên OpenSearch (kết hợp Grafana kiểm thử hiệu năng) giúp theo dõi chỉ số form và khoanh vùng nhanh các form bị ảnh hưởng khi API gặp sự cố.
      - Đóng góp hơn 10 bản sửa lỗi và cải thiện khả năng truy cập (accessibility) cho thư viện giao diện Elevate trên nền MUI của NAB, nhận được 3 lần ghi nhận từ nhóm.
  stack:
    - TypeScript
    - React
    - Node.js
    - MUI
    - OpenSearch
    - Grafana

