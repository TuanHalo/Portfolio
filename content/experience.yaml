- id: fullstack-engineer-nab
  company: NAB Innovation Centre Vietnam
  role:
    en: Fullstack Engineer
    vi: Kỹ sư Fullstack
  start: 2025-04-01
  location:
    en: Ho Chi Minh City, Vietnam
    vi: TP. Hồ Chí Minh, Việt Nam
  highlights:
    en:
      - Built and standardized 30+ reusable components for an internal dynamic form engine that runs 100+ forms across nab.com.au, nabONE, nabTrade, and nabConnect (100,000+ monthly banker and customer visits). Split complex components by responsibility to cut duplication and ship new forms faster.
      - Added frontend debouncing and backend request batching to form submissions to cut server traffic and stay within downstream API limits. Audited shared component dependencies before each upgrade to prevent regressions.
      - Standardized structured backend logging across multi-API form flows so the team could build OpenSearch dashboards and alerts (paired with Grafana performance checks) to track form metrics and spot which forms were affected during API outages.
      - Shipped 10+ bug fixes and accessibility improvements to NAB's MUI-based Elevate UI library, and received team recognition three times.
    vi:
      - Xây dựng và chuẩn hóa hơn 30 component dùng lại cho hệ thống tạo form động nội bộ đang chạy hơn 100 form trên nab.com.au, nabONE, nabTrade và nabConnect (hơn 100.000 lượt truy cập của nhân viên ngân hàng và khách hàng mỗi tháng). Tách nhỏ các component phức tạp theo chức năng để bớt lặp code và ra form mới nhanh hơn.
      - Thêm debouncing ở frontend và batching request ở backend cho luồng gửi form để giảm số lần gọi server và không vượt ngưỡng giới hạn của các API phía sau. Rà soát các phụ thuộc của component dùng chung trước mỗi đợt nâng cấp để tránh lỗi hồi quy.
      - Chuẩn hóa định dạng log ở backend cho các luồng form gọi nhiều API để dựng dashboard và cảnh báo trên OpenSearch (kết hợp kiểm thử hiệu năng bằng Grafana), giúp theo dõi chỉ số và tìm nhanh các form bị ảnh hưởng khi API lỗi.
      - Gửi hơn 10 bản sửa lỗi và cải thiện accessibility cho thư viện giao diện Elevate (trên nền MUI) của NAB, được nhóm ghi nhận 3 lần.
  stack:
    - TypeScript
    - React
    - Node.js
    - MUI
    - OpenSearch
    - Grafana

